    <style>
        /* ── China page specific styles ── */
        :root {
            --vermillion: #c23a2b;
            --vermillion-dim: rgba(194, 58, 43, 0.15);
            --gold-dim: rgba(201, 168, 76, 0.08);
            --font-serif-cn: 'LXGW WenKai', 'Songti SC', 'SimSun', serif;
        }

        /* Subtle warm ambient glow */
        .china-page::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 600px 400px at 85% 10%, var(--vermillion-dim), transparent),
                radial-gradient(ellipse 500px 500px at 10% 80%, var(--gold-dim), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .china-page {
            position: relative;
        }

        /* Chinese subtitle under page title */
        .cn-title {
            font-family: var(--font-serif-cn);
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 300;
            color: var(--vermillion);
            margin-top: 10px;
            letter-spacing: 0.3em;
        }

        /* Thin vermillion rule */
        .cn-rule {
            width: 40px;
            height: 1px;
            background: var(--vermillion);
            margin: 20px auto 0;
            opacity: 0.6;
        }

        /* ── City Tabs ── */
        .tabs-container {
            position: sticky;
            top: 56px;
            z-index: 50;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 0 clamp(20px, 4vw, 48px);
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 18px 22px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-btn .cn-name {
            font-family: var(--font-serif-cn);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.15em;
            opacity: 0.5;
            transition: opacity 0.3s, color 0.3s;
        }

        .tab-btn:hover {
            color: var(--fg);
        }

        .tab-btn:hover .cn-name {
            opacity: 0.7;
        }

        .tab-btn.active {
            color: var(--fg);
        }

        .tab-btn.active .cn-name {
            color: var(--vermillion);
            opacity: 1;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1.5px;
            background: var(--vermillion);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active::after {
            width: 24px;
        }

        /* ── Photo Grid (Masonry) ── */
        .grid-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px clamp(16px, 3vw, 48px) 80px;
        }

        .photo-grid {
            columns: 3;
            column-gap: 12px;
        }

        .photo-grid .photo-item {
            break-inside: avoid;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border-radius: 2px;
        }

        .photo-grid .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1), filter 0.4s;
        }

        .photo-grid .photo-item:hover img {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        .photo-grid .photo-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(194, 58, 43, 0.06) 0%,
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .photo-grid .photo-item:hover::after {
            opacity: 1;
        }

        /* City panels */
        .city-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .city-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Lightbox ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }

        .lightbox.open {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 2px;
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .lightbox.open img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 28px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: var(--fg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: color 0.2s, border-color 0.2s;
        }

        .lightbox-nav:hover {
            color: var(--fg);
            border-color: rgba(255,255,255,0.25);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* ── Responsive Grid ── */
        @media (max-width: 1024px) {
            .photo-grid { columns: 2; }
        }

        @media (max-width: 560px) {
            .photo-grid { columns: 1; max-width: 480px; margin: 0 auto; }
            .grid-wrapper { padding: 28px 16px 60px; }
            .tab-btn { padding: 14px 14px; font-size: 11px; }
            .tab-btn .cn-name { font-size: 10px; }
        }
    </style>

    <script src="script.js"></script>
    <script>
        // ── Tab Switching ──
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.city-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const city = btn.dataset.city;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                panels.forEach(p => p.classList.remove('active'));
                document.getElementById(city).classList.add('active');
            });
        });

        // ── Lightbox ──
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const closeBtn = lightbox.querySelector('.lightbox-close');
        const prevBtn = lightbox.querySelector('.lightbox-prev');
        const nextBtn = lightbox.querySelector('.lightbox-next');
        let currentImages = [];
        let currentIndex = 0;

        function getActiveImages() {
            const activePanel = document.querySelector('.city-panel.active');
            return Array.from(activePanel.querySelectorAll('.photo-item img')).map(img => img.src);
        }

        function openLightbox(imgEl) {
            currentImages = getActiveImages();
            currentIndex = currentImages.indexOf(imgEl.src);
            lightboxImg.src = imgEl.src;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        function navigate(dir) {
            currentIndex = (currentIndex + dir + currentImages.length) % currentImages.length;
            lightboxImg.src = currentImages[currentIndex];
        }

        document.querySelectorAll('.photo-item').forEach(item => {
            item.addEventListener('click', () => {
                openLightbox(item.querySelector('img'));
            });
        });

        closeBtn.addEventListener('click', closeLightbox);
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });
    </script>
