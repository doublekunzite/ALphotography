  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --bg-elevated: #111111;
      --text: #e8e8e8;
      --text-muted: #666666;
      --vermillion: #c23a2b;
      --vermillion-dim: rgba(194, 58, 43, 0.15);
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif-cn: 'LXGW WenKai', 'Songti SC', 'SimSun', serif;
      --nav-height: 56px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Subtle ink-wash background ── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 600px 400px at 85% 10%, var(--vermillion-dim), transparent),
        radial-gradient(ellipse 500px 500px at 10% 80%, var(--gold-dim), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      z-index: 100;
    }

    .nav-logo {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.3s;
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0; right: 0;
      height: 1px;
      background: var(--vermillion);
    }

    /* Mobile nav toggle */
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-toggle { display: block; }
      .nav-links.open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: var(--nav-height);
        left: 0; right: 0;
        background: rgba(10,10,10,0.95);
        backdrop-filter: blur(12px);
        padding: 20px clamp(20px, 4vw, 48px);
        gap: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
    }

    /* ── Page Header ── */
    .page-header {
      padding-top: calc(var(--nav-height) + 80px);
      padding-bottom: 16px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .page-header h1 {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
    }

    .page-header .cn-title {
      font-family: var(--font-serif-cn);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 300;
      color: var(--vermillion);
      margin-top: 12px;
      letter-spacing: 0.3em;
    }

    /* Thin vermillion rule */
    .page-header .rule {
      width: 40px;
      height: 1px;
      background: var(--vermillion);
      margin: 24px auto 0;
      opacity: 0.6;
    }

    /* ── City Tabs ── */
    .tabs-container {
      position: sticky;
      top: var(--nav-height);
      z-index: 50;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 0 clamp(20px, 4vw, 48px);
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      max-width: 900px;
      margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 18px 24px;
      cursor: pointer;
      position: relative;
      transition: color 0.3s;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tab-btn .cn-name {
      font-family: var(--font-serif-cn);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn:hover .cn-name {
      opacity: 0.7;
    }

    .tab-btn.active {
      color: var(--text);
    }

    .tab-btn.active .cn-name {
      color: var(--vermillion);
      opacity: 1;
    }

    /* Active indicator line */
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1.5px;
      background: var(--vermillion);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active::after {
      width: 24px;
    }

    @media (max-width: 520px) {
      .tab-btn {
        padding: 14px 16px;
        font-size: 11px;
      }
      .tab-btn .cn-name { font-size: 10px; }
    }

    /* ── Photo Grid (Masonry via CSS columns) ── */
    .grid-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px clamp(16px, 3vw, 48px) 80px;
    }

    .photo-grid {
      columns: 3;
      column-gap: 12px;
    }

    .photo-grid .photo-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 2px;
    }

    .photo-grid .photo-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1), filter 0.4s;
    }

    .photo-grid .photo-item:hover img {
      transform: scale(1.03);
      filter: brightness(1.05);
    }

    /* Subtle hover overlay with vermillion tint */
    .photo-grid .photo-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(194, 58, 43, 0.06) 0%,
        transparent 40%
      );
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .photo-grid .photo-item:hover::after {
      opacity: 1;
    }

    /* City panels */
    .city-panel {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .city-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .lightbox.open img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: var(--text);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: color 0.2s, border-color 0.2s;
    }

    .lightbox-nav:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.25);
    }

    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Responsive Grid ── */
    @media (max-width: 1024px) {
      .photo-grid { columns: 2; }
    }

    @media (max-width: 560px) {
      .photo-grid { columns: 1; max-width: 480px; margin: 0 auto; }
      .grid-wrapper { padding: 28px 16px 60px; }
    }
  </style>
</head>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous">&#8249;</button>
    <img src="" alt="">
    <button class="lightbox-nav lightbox-next" aria-label="Next">&#8250;</button>
  </div>

  <!-- Footer -->

    &copy; AL Photography
  </footer>

  <script>
    // ── Tab Switching ──
    const tabBtns = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.city-panel');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const city = btn.dataset.city;

        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        panels.forEach(p => p.classList.remove('active'));
        document.getElementById(city).classList.add('active');

        // Close mobile nav if open
        document.querySelector('.nav-links')?.classList.remove('open');
      });
    });

    // ── Lightbox ──
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const closeBtn = lightbox.querySelector('.lightbox-close');
    const prevBtn = lightbox.querySelector('.lightbox-prev');
    const nextBtn = lightbox.querySelector('.lightbox-next');
    let currentImages = [];
    let currentIndex = 0;

    function getActiveImages() {
      const activePanel = document.querySelector('.city-panel.active');
      return Array.from(activePanel.querySelectorAll('.photo-item img')).map(img => img.src);
    }

    function openLightbox(imgEl) {
      currentImages = getActiveImages();
      // Find the full-res version by replacing the thumbnail URL
      currentIndex = currentImages.indexOf(imgEl.src);
      lightboxImg.src = imgEl.src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + currentImages.length) % currentImages.length;
      lightboxImg.src = currentImages[currentIndex];
    }

    // Attach click to all photo items
    document.querySelectorAll('.photo-item').forEach(item => {
      item.addEventListener('click', () => {
        openLightbox(item.querySelector('img'));
      });
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', () => navigate(-1));
    nextBtn.addEventListener('click', () => navigate(1));

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
  </script>
